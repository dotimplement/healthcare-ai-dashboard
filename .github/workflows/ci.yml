name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check healthcare_ai/ tests/ main.py refresh.py

      - name: Data contract tests
        run: uv run pytest

      - name: Dashboard imports cleanly
        run: uv run python -c "import ast, sys; ast.parse(open('main.py').read())"

      - name: Refresh pipeline is wired up
        run: uv run python refresh.py --dry-run
