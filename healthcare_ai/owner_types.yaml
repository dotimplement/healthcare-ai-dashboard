# Owner taxonomy for the ownership charts.
#
# Keyed on the GitHub OWNER (the part before the "/"), matched exactly and
# case-insensitively. First and only match wins -- there is no substring
# matching, deliberately: the previous substring rules classified
# `awslabs/fhir-works-on-aws-authz-smart` as a community project because the
# repo name contained "smart".
#
# Owners not listed here fall back to the coarse "Organization"/"User" label
# from the GitHub API (repos_classified.csv) and are EXCLUDED from the
# four-way ownership charts. tests/test_owner_types.py fails if the
# unclassified share exceeds config.MAX_UNCLASSIFIED_OWNER_SHARE.
#
# After each quarterly refresh, run:
#     uv run python -m healthcare_ai.owner_types --report
# to list newly-seen owners that need a label.
#
# Valid types: Incumbent, Research Lab, Startup,
#              Community Project/Non-Profit, User

